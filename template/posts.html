<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>

</head>
<script>
    htmx.config({
        "get": {
            "headers": {
                "Accept": "text/html"
            }
        }
    });
</script>

<body>
    <form hx-get="/posts" hx-target="#posts" hx-swap="innerHTML">
        <label for="authorName">Search by author:</label>
        <input id="authorName" type="search" name="author_name" placeholder="Search by author...">
        <button type="submit">Search</button>
    </form>
    <ul id="posts">
        {{ range . }}
        {{template "post-item" .}}
        {{ end }}
    </ul>
</body>

</html>
